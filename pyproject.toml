[project]
name = "dataplat"
version = "0.1.0"
description = "One command to manage any shape of data platform: databases, ingestion, BI, cloud, and CI."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Hans Lemm" }]
keywords = [
    "data-platform",
    "cli",
    "postgres",
    "redshift",
    "airbyte",
    "superset",
    "aws",
    "dbt",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: System :: Systems Administration",
    "Topic :: Utilities",
]
requires-python = ">=3.13"
dependencies = [
    "croniter>=2.0.0",
    "httpx>=0.25.0",
    "plotext>=5.3.2",
    "psycopg[binary]>=3.2.9",
    "rich>=14.2.0",
    "textual>=0.64.0",
    "typer>=0.21.1",
    "boto3>=1.35.0",
]

[project.scripts]
dp = "dataplat.main:app"

[project.urls]
Homepage = "https://github.com/hanslemm/dataplat"
Repository = "https://github.com/hanslemm/dataplat"
Issues = "https://github.com/hanslemm/dataplat/issues"
Changelog = "https://github.com/hanslemm/dataplat/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[dependency-groups]
dev = [
    "mypy>=1.18.2",
    "pytest>=9.0.3",
    "ruff>=0.14.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["F", "I", "B", "UP", "SIM"]
ignore = [
    # Typer's API is built on function-call defaults; B008 fights the framework.
    "B008",
    # The CLI idiom is print-the-error then `raise typer.Exit(code=1)`; Typer
    # swallows Exit, so exception chaining is never displayed and `from exc`
    # everywhere is pure noise.
    "B904",
    # (str, Enum) -> StrEnum changes str(x) output; several enums are rendered
    # directly, so the mechanical conversion is not behavior-preserving.
    "UP042",
]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
warn_redundant_casts = true
warn_unused_ignores = true
strict_equality = true
disable_error_code = ["import-untyped"]
files = ["dataplat/main.py", "dataplat/core", "dataplat/services", "dataplat/cli"]
