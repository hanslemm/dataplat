[project]
name = "dataplat"
version = "0.3.0"
description = "One command to manage any shape of data platform: databases, ingestion, BI, cloud, and CI."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Hans Lemm" }]
keywords = [
    "data-platform",
    "cli",
    "postgres",
    "redshift",
    "duckdb",
    "airbyte",
    "superset",
    "aws",
    "dbt",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    # Not "OS Independent": that was a claim nothing backed. `dp config init`
    # calls Path.symlink_to (core/envrc.py), which on Windows needs Developer
    # Mode or elevation; the dependency self-install re-execs via os.execvp
    # (cli/_missing.py), which on Windows returns to the shell before the child
    # finishes, so the re-run's exit code is lost; `dp ci github runner` shells
    # out to docker; and role_create.py creates the credentials CSV with mode
    # 0600, which Windows ignores -- the file it just wrote would then be
    # reported insecure by its own permission check. CI is ubuntu-latest only
    # and macOS is the author's daily driver, so these two are what is actually
    # exercised. A classifier is a claim about what was tested; add Windows when
    # something tests Windows.
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: System :: Systems Administration",
    "Topic :: Utilities",
]
# 3.12 is the real floor: the only construct above 3.11 anywhere in the package
# is the PEP 695 generic in dataplat/cli/db/role.py, and no 3.13-only stdlib API
# is used. .python-version stays at 3.13 -- that is the dev pin, not the floor.
requires-python = ">=3.12"
dependencies = [
    "rich>=14.2.0",
    "typer>=0.21.1",
]

[project.optional-dependencies]
db = ["psycopg[binary]>=3.2.9"]
# An engine-level extra, not an area: `duckdb` is one SqlEngine inside the db
# area, so it is not in `db`. Two reasons it is separate. A psycopg-only user
# must not install an embedded database engine to run `dp db describe` against
# PostgreSQL -- the extension module alone is 45 MB, three times psycopg's --
# and a DuckDB file needs no server, so the two are never both required by the
# same target. dataplat[db] stays the area's contract (see
# dataplat/core/deps.py AREAS); dataplat[db,duckdb] is what a DuckDB target
# needs. The floor is the version the dialect was probed against -- every
# catalog dataplat reads on this engine (duckdb_tables, duckdb_constraints,
# pragma_database_size, pg_catalog compatibility views) was verified on 1.5.5.
duckdb = ["duckdb>=1.5.5"]
cloud = ["boto3>=1.35.0", "plotext>=5.3.2"]
ingest = ["httpx>=0.25.0", "textual>=0.64.0", "croniter>=2.0.0"]
bi = ["httpx>=0.25.0"]
all = ["dataplat[db,duckdb,cloud,ingest,bi]"]

[project.scripts]
dp = "dataplat.main:app"

[project.urls]
Homepage = "https://github.com/hanslemm/dataplat"
Repository = "https://github.com/hanslemm/dataplat"
Issues = "https://github.com/hanslemm/dataplat/issues"
Changelog = "https://github.com/hanslemm/dataplat/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[dependency-groups]
dev = [
    "mypy>=1.18.2",
    "pytest>=9.0.3",
    "ruff>=0.14.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    # Tests under tests/integration/ execute real SQL against a live
    # PostgreSQL (DP_TEST_PG_DSN). Registered so `-m 'not integration'`
    # selects against a known marker instead of warning about an unknown one.
    "integration: requires a live PostgreSQL server",
    # Redshift cannot be containerized, so these two run only when someone
    # points them at a cluster. Read-only and mutating are separate markers
    # because they need different permission to run: `redshift` is safe against
    # a warehouse in use, `redshift_ddl` is not, and keeping them selectable
    # apart is what lets a production cluster be used for the first tier only.
    "redshift: requires a live Redshift cluster; read-only",
    "redshift_ddl: requires a DISPOSABLE Redshift cluster; mutates it",
]

[tool.ruff]
# Track requires-python, not .python-version: the linters must judge the oldest
# interpreter we advertise, or UP rewrites land syntax the floor cannot parse.
target-version = "py312"
line-length = 88

[tool.ruff.lint]
# E/W make line-length above enforceable: without pycodestyle selected it was a
# number nothing checked, and the tree had drifted to 164 violations. `ruff
# format` owns layout; E501 is what it cannot fix (long string literals), so it
# stays a lint error a human has to answer.
select = ["E", "W", "F", "I", "B", "UP", "SIM"]
ignore = [
    # Typer's API is built on function-call defaults; B008 fights the framework.
    "B008",
    # The CLI idiom is print-the-error then `raise typer.Exit(code=1)`; Typer
    # swallows Exit, so exception chaining is never displayed and `from exc`
    # everywhere is pure noise.
    "B904",
    # (str, Enum) -> StrEnum changes str(x) output; several enums are rendered
    # directly, so the mechanical conversion is not behavior-preserving.
    "UP042",
]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_redundant_casts = true
warn_unused_ignores = true
strict_equality = true
disable_error_code = ["import-untyped"]
files = ["dataplat/main.py", "dataplat/core", "dataplat/services", "dataplat/cli"]
