name: CI

on:
  push:
    branches: ["**"]
    # A tag push matches no branch, so without this a release tag would run no
    # checks at all before release.yml publishes it.
    tags: ["[0-9]*.[0-9]*.[0-9]*"]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      # The floor and the ceiling break for different reasons; report both
      # rather than hiding one behind the other.
      fail-fast: false
      matrix:
        # Lowest version requires-python allows, plus the dev pin.
        python-version: ["3.12", "3.13"]
    env:
      # Overrides .python-version (3.13). Without it every uv command in the
      # 3.12 leg would still pick the pin and we would test 3.13 twice.
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup uv
        # Pinned exactly, not `@v9`: setup-uv dropped floating major tags after
        # v7, so `@v9` does not resolve at all and the workflow fails to start.
        #
        # prune-cache is set because v9 flipped its default from true to false.
        # Left implicit, the upgrade would silently stop pruning and grow the
        # Actions cache for no benefit — this keeps the behaviour v5 had.
        uses: astral-sh/setup-uv@v9.0.0
        with:
          prune-cache: true

      - name: Setup Python
        run: uv python install ${{ matrix.python-version }}

      # --all-extras is what installs psycopg (the "db" extra) and duckdb (the
      # "duckdb" extra). The DuckDB step below needs the latter and has no skip
      # path, so dropping this flag turns into a hard failure rather than a
      # quietly shrinking test run.
      - name: Install dependencies
        run: uv sync --group dev --all-extras

      - name: Ruff
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: MyPy
        run: uv run mypy dataplat

      # Deselected rather than left to skip. With no server reachable the
      # integration tests would skip on their own, but naming the marker keeps
      # this leg an honest database-free signal instead of a growing pile of
      # skips reported twice per push. Marker deselection happens after
      # collection, so an import error under tests/integration/ still fails
      # here and does not have to wait for the integration job.
      # --cov-fail-under=0 because the floor belongs to the combined report, not
      # to one leg of it. No job here runs the whole suite -- this one skips the
      # tier that needs a server -- so enforcing the threshold per job would fail
      # every job for the same wrong reason.
      - name: Pytest (unit)
        run: uv run pytest -m "not integration" --cov --cov-report= --cov-fail-under=0

      # Only from 3.13, the dev pin. Both interpreters execute the same lines, so
      # a second copy would add nothing to the union and would need a distinct
      # artifact name to avoid a collision.
      - name: Stash coverage
        if: matrix.python-version == '3.13'
        run: mv .coverage coverage-unit
      - name: Upload coverage
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-unit
          path: coverage-unit
          include-hidden-files: true

      # The third engine's real-SQL tier, and the only one that belongs in this
      # job: DuckDB is a library, so it needs no container, no credentials and no
      # wait loop -- just the extra `uv sync` already installed. Running it in
      # both matrix legs is the point, since an embedded engine is the one place
      # an interpreter difference could plausibly show up in a database.
      #
      # Selected by path rather than by marker. tests/integration/duckdb/ sits
      # under tests/integration/, so its conftest chain stamps every test with
      # the `integration` marker the step above deselects; a `duckdb` marker
      # would have to be registered in pyproject.toml, and one line here is
      # cheaper than a marker that then has to be kept in sync with a directory.
      # These tests are consequently also collected by the `integration` job
      # below -- harmless, since they run in under two seconds and touch no
      # server, but *this* is where DuckDB is proved, on both interpreters.
      - name: Pytest (DuckDB integration)
        run: uv run pytest tests/integration/duckdb

  # A separate job, not extra steps in the matrix above, for two reasons: the
  # unit legs are the fast signal and must not queue behind a container boot,
  # and a database per Python version would buy nothing -- the SQL these tests
  # validate is identical on every interpreter.
  integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # An explicit major, never "latest": a silent server upgrade must not be
        # able to change what this job proves. Adding a second major is a
        # one-token edit here if catalog drift across majors ever earns the
        # minutes.
        postgres-version: ["16"]
        # The second leg runs the identical suite against the identical server
        # with `standard_conforming_strings` off -- the setting Redshift runs with,
        # and one PostgreSQL has defaulted to `on` since 9.1.
        #
        # This is not a Redshift emulation, and should not be read as one. Redshift
        # differs in ways no setting reproduces (an 8.0.2 leader node, no
        # aclexplode, different catalogs), and the engine-specific SQL in this tree
        # is already escaped for whichever engine executes it. What this leg proves
        # is narrower and worth having on its own: that no SQL a PostgreSQL target
        # runs depends on that setting being on.
        #
        # The absence of that invariant shipped a real bug. `ESCAPE '\'` is a
        # syntax error when the setting is off, so `dp db top-tables` and
        # `dp db dbt-orphans` failed on every Redshift target from 0.2.1 through
        # 0.4.0 -- five releases, green badge throughout, because every test ran
        # against a server whose default hid it. One extra job is the cheapest
        # standing guard against the next one, and it needs no new tests.
        #
        # It earned itself on its first run, failing `role_admin._LIST_ROLES_SQL`
        # -- the same `ESCAPE '\'` in a Postgres-only query, harmless on a default
        # server and fatal on one carrying the legacy setting.
        scs: ["on", "off"]
    env:
      # The dev pin only -- see the job comment. The 3.12 floor is imported,
      # linted and type-checked by `checks` above.
      UV_PYTHON: "3.13"
      # Matches the default in tests/integration/conftest.py, set explicitly so
      # the published port below and the DSN cannot drift apart unnoticed.
      DP_TEST_PG_DSN: postgresql://postgres:postgres@127.0.0.1:55432/dataplat_test
      # The single most important line in this file. Without it an unreachable
      # server turns every integration test into a skip: the job goes green, the
      # badge stays green, and CI reports success while executing none of the
      # SQL this suite exists to validate. Truthy here means the harness raises
      # instead of skipping.
      DP_TEST_PG_REQUIRED: "1"
      # libpq reads PGOPTIONS and forwards it at connection setup, so every
      # connection the suite opens inherits it -- including the ones fixtures make
      # directly, which a server-side ALTER DATABASE would also cover but only
      # after both legs stopped sharing one container recipe.
      PGOPTIONS: "-c standard_conforming_strings=${{ matrix.scs }}"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # `docker run`, not a `services:` block. A service container is started
      # with the image's default command and Actions gives no way to append
      # arguments to it, so `-c shared_preload_libraries=pg_stat_statements`
      # cannot be passed. Without that preload the extension still installs and
      # its columns are still describable, but every read of the view raises
      # "pg_stat_statements must be loaded via shared_preload_libraries" -- that
      # errors the harness's own pg_stat_statements test and leaves the
      # version-branching second half of fetch_query_history_postgres
      # unexecuted, which is precisely the coverage this job exists for.
      #
      # Detached and placed before `uv sync` so initdb runs while dependencies
      # install; by the time the wait step runs the server is normally up.
      - name: Start PostgreSQL ${{ matrix.postgres-version }}
        run: |
          docker run --detach --name dp-pg-ci \
            --publish 55432:5432 \
            --env POSTGRES_PASSWORD=postgres \
            --env POSTGRES_DB=dataplat_test \
            --health-cmd "pg_isready -h 127.0.0.1 -U postgres -d dataplat_test" \
            --health-interval 2s \
            --health-timeout 5s \
            --health-retries 30 \
            postgres:${{ matrix.postgres-version }} \
            -c shared_preload_libraries=pg_stat_statements

      - name: Setup uv
        # Pinned exactly, not `@v9`: setup-uv dropped floating major tags after
        # v7, so `@v9` does not resolve at all and the workflow fails to start.
        #
        # prune-cache is set because v9 flipped its default from true to false.
        # Left implicit, the upgrade would silently stop pruning and grow the
        # Actions cache for no benefit — this keeps the behaviour v5 had.
        uses: astral-sh/setup-uv@v9.0.0
        with:
          prune-cache: true

      - name: Setup Python
        run: uv python install 3.13

      # --all-extras is what installs psycopg (the optional "db" extra). The
      # harness routes a missing psycopg through the same gate as an unreachable
      # server, so under DP_TEST_PG_REQUIRED=1 dropping it is a hard error
      # rather than a quiet skip.
      - name: Install dependencies
        run: uv sync --group dev --all-extras

      # `-h 127.0.0.1` in the health command above is deliberate: the official
      # entrypoint runs a temporary socket-only server while it initialises the
      # data directory, so a Unix-socket probe reports "ready" before the real
      # server is listening on TCP -- which is how the tests connect.
      - name: Wait for PostgreSQL
        run: |
          for _ in $(seq 60); do
            state="$(
              docker inspect \
                --format '{{.State.Running}}/{{.State.Health.Status}}' dp-pg-ci
            )"
            case "$state" in
              true/healthy)
                echo "PostgreSQL is accepting TCP connections."
                exit 0
                ;;
              # An exited or unhealthy container (bad flag, image change, OOM)
              # will never turn healthy: fail now with its log instead of
              # stalling for the full two minutes.
              false/* | */unhealthy)
                break
                ;;
            esac
            sleep 2
          done
          echo "::error::PostgreSQL never became healthy (state: $state)."
          docker logs dp-pg-ci
          exit 1

      # Preloading the library only makes the view available server-wide; the
      # extension itself is per-database and has to be created once. Nothing in
      # the suite can do it -- the fixtures roll back every transaction.
      - name: Enable pg_stat_statements
        run: |
          docker exec dp-pg-ci psql \
            --username postgres --dbname dataplat_test \
            --set ON_ERROR_STOP=1 \
            --command 'CREATE EXTENSION IF NOT EXISTS pg_stat_statements'

      # Asserted, not trusted. A PGOPTIONS typo, or a libpq that ignored it, would
      # turn the second leg into a silent duplicate of the first -- and this job
      # would still go green, which is the failure mode the whole leg exists to
      # prevent.
      - name: Verify standard_conforming_strings is ${{ matrix.scs }}
        env:
          EXPECTED_SCS: ${{ matrix.scs }}
        run: |
          uv run python -c "
          import os, psycopg
          want = os.environ['EXPECTED_SCS']
          with psycopg.connect(os.environ['DP_TEST_PG_DSN']) as conn:
              got = conn.execute('SHOW standard_conforming_strings').fetchone()[0]
          print(f'standard_conforming_strings = {got} (expected {want})')
          assert got == want, f'PGOPTIONS did not take effect: {got} != {want}'
          "

      - name: Pytest (integration)
        run: uv run pytest -m integration --cov --cov-report= --cov-fail-under=0

      # Only the `on` leg. Both scs legs run identical Python over identical SQL,
      # so the second contributes no new lines -- the leg exists to prove a server
      # setting, not to reach different code.
      - name: Stash coverage
        if: matrix.scs == 'on'
        run: mv .coverage coverage-integration
      - name: Upload coverage
        if: matrix.scs == 'on'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-integration
          path: coverage-integration
          include-hidden-files: true

      # For the failures that are about the database rather than the SQL:
      # refused connections, a crashed backend, the OOM killer.
      - name: PostgreSQL server log
        if: failure()
        run: docker logs dp-pg-ci

  # Coverage is reported here and nowhere else, because no other job can see the
  # whole picture: `checks` deselects the tier that needs a server and
  # `integration` deselects everything else. Either number alone is wrong in a way
  # that looks plausible -- the unit leg reads 87%, the integration leg 30%, and
  # the union is what the suite actually exercises.
  #
  # What the figure is for: catching a test file that stopped running, or a
  # sizeable module that arrived without tests. What it is not for is evidence of
  # correctness -- see the long note on `fail_under` in pyproject.toml, and the
  # bug that was covered the whole time it was broken.
  coverage:
    runs-on: ubuntu-latest
    needs: [checks, integration]
    env:
      UV_PYTHON: "3.13"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup uv
        # Pinned exactly and prune-cache set for the reasons given in the jobs
        # above; setup-uv has no floating major tag past v7.
        uses: astral-sh/setup-uv@v9.0.0
        with:
          prune-cache: true

      - name: Setup Python
        run: uv python install 3.13

      # No --all-extras: this job runs no tests, so it needs the coverage tool and
      # nothing else the suite imports.
      - name: Install dependencies
        run: uv sync --group dev

      # Into the working directory, where `coverage combine` looks. Each arrives
      # as its own artifact because a matrix leg cannot append to a sibling's.
      - name: Download coverage from every leg
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-*
          merge-multiple: true

      # Renamed only now: `.coverage.*` is the pattern combine consumes, and a
      # file called that in a job that *runs* pytest would be erased on startup by
      # pytest-cov before it could be read.
      - name: Combine
        run: |
          mv coverage-unit .coverage.unit
          mv coverage-integration .coverage.integration
          uv run coverage combine
          uv run coverage report

      # Rendered into the run summary so a reviewer sees the number without
      # opening a log, and the per-file misses without running anything locally.
      - name: Summary
        if: always()
        run: |
          {
            echo '### Coverage'
            echo
            echo '```'
            uv run coverage report --fail-under=0 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
