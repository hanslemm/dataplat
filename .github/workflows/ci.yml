name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Setup Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --group dev --all-extras

      - name: Ruff
        run: uv run ruff check .

      - name: MyPy
        run: uv run mypy dataplat

      - name: Pytest
        run: uv run pytest
